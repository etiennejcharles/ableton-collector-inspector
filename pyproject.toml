[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ableton-inspector"
dynamic = ["version"]
description = "Collector Inspector audits plug-ins and audio dependencies in Ableton Live projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.11"
keywords = ["ableton", "audio", "backup", "collector", "portability"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "PySide6-Essentials>=6.8.0,<7.0.0",
  "textual>=0.89.0,<9.0.0",
  "typer>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "pyinstaller>=6.11.0,<7.0.0",
  "pytest>=8.0.0",
  "pytest-qt>=4.4.0,<5.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[project.scripts]
collector-inspector-cli = "ableton_audio_collector.cli:app"
ableton-inspector-cli = "ableton_audio_collector.cli:app"

[project.gui-scripts]
collector-inspector = "ableton_audio_collector.gui:main"
ableton-inspector = "ableton_audio_collector.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]
ignore = ["B008"]

[tool.hatch.version]
path = "src/ableton_audio_collector/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_audio_collector"]
